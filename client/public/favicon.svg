<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 48" fill="none">
  <defs>
    <!-- Крылья -->
    <linearGradient id="fav-w-left" x1="26" y1="18" x2="4" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
    <linearGradient id="fav-w-right" x1="26" y1="18" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>

    <!-- Банан -->
    <linearGradient id="fav-b-top" x1="16" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="45%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="fav-b-bot" x1="12" y1="22" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="fav-b-stem" x1="28" y1="4" x2="31" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Тень -->
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#fav-shadow)">
    <!-- Левое крыло -->
    <path
      d="M 28 19
         C 22 15 12 11 4 8
         C 3.5 12 5 16 7.5 18
         C 6 20 8 23 11.5 24
         C 10 25.5 13 27 16.5 26
         C 20 25 25 24 28 23 Z"
      fill="url(#fav-w-left)"
      stroke="#D4D4D8"
      stroke-width="0.9"
    />
    <path d="M 8 13 C 13 15 19 18 25 19.5" stroke="#E4E4E7" stroke-width="0.8" stroke-linecap="round" />

    <!-- Правое крыло -->
    <path
      d="M 30 19
         C 36 15 44 11 48 8
         C 48.5 12 47 16 44.5 18
         C 46 20 44 23 40.5 24
         C 42 25.5 39 27 35.5 26
         C 32 25 29 24 28 23 Z"
      fill="url(#fav-w-right)"
      stroke="#D4D4D8"
      stroke-width="0.9"
    />
    <path d="M 44 13 C 39 15 33 18 27 19.5" stroke="#E4E4E7" stroke-width="0.8" stroke-linecap="round" />

    <!-- Банан -->
    <path
      d="M 28 7.5 C 35 13 41 21 41 30 C 41 39 33 45 20 45 C 12 45 7.5 41.5 8 38 C 8.5 35 13 35 18 33.5 C 27 31 32 22 30 14.5 Z"
