<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Тень для отличной видимости как на светлых, так и на темных вкладках браузера -->
    <filter id="banana-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Основное тело банана (яркое желтое золото #FFD700 с янтарным контуром) -->
  <path
    d="M5.15 17.89c5.52-1.52 8.65-6.89 7-12C11.55 4 11.5 2 13 2c3.22 0 5 5.5 5 8 0 6.5-4.2 12-10.49 12C5.11 22 2 22 2 20c0-1.5 1.14-1.55 3.15-2.11Z"
    fill="#FFD700"
    stroke="#B45309"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#banana-shadow)"
  />

  <!-- Внутренняя линия ребра банана (как в иконке сайта) -->
  <path
    d="M4 13c3.5-2 8-2 10 2a5.5 5.5 0 0 1 8 5"
    stroke="#B45309"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Зеленый акцент на черенке -->
  <path
    d="M12.5 2.5C13 2 14.5 2 15 2.5"
    stroke="#16A34A"
    stroke-width="1.8"
    stroke-linecap="round"
  />
</svg>
