    />
    <path
      d="M 28 7.5 C 33 11.5 37.5 18 37.5 26.5 C 37.5 35 30 40 19 40.5 C 13 40.8 9 38.5 8 38 C 8.5 35 13 35 18 33.5 C 27 31 32 22 30 14.5 Z"
      fill="url(#fav-b-top)"
      stroke="#B45309"
      stroke-width="1.2"
    />
    <path d="M 30 11 C 35 16 38.5 22.5 38.5 29.5 C 38.5 34.5 35 38.5 27 41" stroke="#FFFFFF" stroke-width="1.2" opacity="0.65" />
    <path d="M 28 7.5 L 29 4.2 L 31 4 L 29.5 8" fill="url(#fav-b-stem)" stroke="#15803D" stroke-width="0.8" />
    <path d="M 8 38 L 7.2 41 L 10 41 Z" fill="#78350F" />
